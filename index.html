<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    box-sizing: border-box;
    font-size: 15px;
    font-weight: 600;
    color: #f7931a;
}

.coin {
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
}

.label {
    font-weight: 700;
    color: #f7931a;
}

.krw, .usd {
    color: #ffffff;
}

.change {
    font-size: 13px;
}

.up {
    color: #00c853;
}

.down {
    color: #ff4d4f;
}

.flat {
    color: #aaa;
}

.premium { color: #bb6cff; }
.discount { color: #00bcd4; }

.fear { color: #ff4d4f; font-weight: 700; }
.greed { color: #00c853; font-weight: 700; }
.neutral { color: #aaa; }

@media (max-width: 480px) {
    .container {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="container" id="price">
    로딩중...
</div>

<script>
async function fetchAll() {
    try {
        const [upbitRes, binanceRes, fxRes, fngRes] = await Promise.all([
            fetch("https://api.upbit.com/v1/ticker?markets=KRW-BTC,KRW-ETH,KRW-SOL"),
            fetch("https://api.binance.com/api/v3/ticker/price?symbols=[\"BTCUSDT\",\"ETHUSDT\",\"SOLUSDT\"]"),
            fetch("https://open.er-api.com/v6/latest/USD"),
            fetch("https://api.alternative.me/fng/?limit=1")
        ]);

        const upbit = await upbitRes.json();
        const binance = await binanceRes.json();
        const fx = await fxRes.json();
        const fng = await fngRes.json();

        const usdkrw = fx.rates.KRW;

        function formatCoin(market, symbol, label) {
            const u = upbit.find(c => c.market === market);
            const b = binance.find(c => c.symbol === symbol);
            if (!u || !b) return "";

            const krw = u.trade_price;
            const prevClose = u.prev_closing_price;
            const changeAmount = krw - prevClose;
            const changePercent = (u.signed_change_rate * 100).toFixed(2);

            const usdt = parseFloat(b.price);
            const converted = usdt * usdkrw;
            const premium = ((krw / converted - 1) * 100).toFixed(2);

            let changeClass = "flat";
            if (changePercent > 0) changeClass = "up";
            if (changePercent < 0) changeClass = "down";

            const arrow = changePercent > 0 ? "▲" :
                          changePercent < 0 ? "▼" : "";

            let premiumClass = premium >= 0 ? "premium" : "discount";

            return `
            <div class="coin">
                <div class="row">
                    <span class="label">${label}</span>
                    <span class="krw">₩${krw.toLocaleString()}</span>
                </div>

                <div class="row change ${changeClass}">
                    전일대비 
                    ${arrow} 
                    ${changeAmount > 0 ? "+" : ""}${changeAmount.toLocaleString()}원
                    (${changePercent > 0 ? "+" : ""}${changePercent}%)
                </div>

                <div class="row">
                    <span class="usd">$${usdt.toLocaleString(undefined,{maximumFractionDigits:2})}</span>
                    <span class="${premiumClass}">
                        김프 ${premium > 0 ? "+" : ""}${premium}%
                    </span>
                </div>
            </div>
            `;
        }

        const fngValue = parseInt(fng.data[0].value);
        const fngText = fng.data[0].value_classification;

        let fngClass = "neutral";
        if (fngValue < 40) fngClass = "fear";
        if (fngValue > 60) fngClass = "greed";

        document.getElementById("price").innerHTML =
            formatCoin("KRW-BTC","BTCUSDT","BTC") +
            formatCoin("KRW-ETH","ETHUSDT","ETH") +
            formatCoin("KRW-SOL","SOLUSDT","SOL") +
            `<div class="coin">
                공포·탐욕 지수:
                <span class="${fngClass}">
                    ${fngValue} (${fngText})
                </span>
            </div>`;

    } catch (e) {
        document.getElementById("price").innerText = "데이터 로드 실패";
    }
}

fetchAll();
setInterval(fetchAll, 15000);
</script>

</body>
</html>
